name: ecommerce

services:
  api:
    container_name: ecommerce-api  
    build:
      context: .
      dockerfile: src/ECommerce.Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${SQL_DATABASE};User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__Redis: redis:6379
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      MailSetting__Mail: ${MAIL_ADDRESS}
      MailSetting__DisplayName: ${MAIL_DISPLAY_NAME}
      MailSetting__Password: ${MAIL_PASSWORD}
      MailSetting__Host: ${MAIL_HOST}
      MailSetting__Port: ${MAIL_PORT}
    ports:
      - "${API_PORT}:8080"
    volumes:
      - product-images:/app/wwwroot/Images
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecommerce-network

  sqlserver:
    container_name: ecommerce-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "${SQL_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - ecommerce-network

  redis:
    container_name: ecommerce-redis
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ecommerce-network

volumes:
  sqlserver-data:
  redis-data:
  product-images:

networks:
  ecommerce-network:
    driver: bridge
