<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileManager - إدارة الملفات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .drag-active {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toast {
            transform: translateX(120%);
            transition: transform 0.3s ease-out;
        }
        .toast.show { transform: translateX(0); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 border-b border-white/50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h1 class="text-xl font-bold text-slate-800">FileManager</h1>
            </div>
            <div class="flex items-center gap-2 text-sm text-slate-500">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                <span>API: <span id="apiStatus" class="font-medium text-slate-700">localhost:7240</span></span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">

        <!-- API Config -->
        <div class="glass rounded-2xl p-5 shadow-sm fade-in">
            <div class="flex flex-col sm:flex-row gap-4 items-end sm:items-center">
                <div class="flex-1 w-full">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">رابط الـ API</label>
                    <input type="text" id="baseUrl" value="https://localhost:7240" 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm font-medium"
                        placeholder="https://localhost:7240">
                </div>
                <button onclick="testConnection()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-semibold transition-all shadow-lg shadow-slate-800/20 flex items-center gap-2 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    اختبار الاتصال
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Upload Single File -->
            <div class="glass rounded-2xl p-6 shadow-sm fade-in" style="animation-delay:0.1s">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800">رفع ملف واحد</h2>
                </div>

                <div id="dropZoneSingle" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center transition-all cursor-pointer hover:border-blue-400 hover:bg-blue-50/50 bg-white/40">
                    <input type="file" id="fileSingle" class="hidden" onchange="handleFileSelect(this, 'single')">
                    <svg class="w-10 h-10 text-slate-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-sm text-slate-600 font-medium">اسحب الملف هنا أو اضغط للاختيار</p>
                    <p class="text-xs text-slate-400 mt-1" id="singleFileName"></p>
                </div>

                <button onclick="uploadSingle()" id="btnSingle" disabled class="mt-4 w-full py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl text-sm font-semibold transition-all shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                    <span id="loaderSingle" class="loader hidden"></span>
                    <span id="textSingle">رفع الملف</span>
                </button>
            </div>

            <!-- Upload Multiple Files -->
            <div class="glass rounded-2xl p-6 shadow-sm fade-in" style="animation-delay:0.2s">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800">رفع ملفات متعددة</h2>
                </div>

                <div id="dropZoneMulti" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center transition-all cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/50 bg-white/40">
                    <input type="file" id="fileMulti" multiple class="hidden" onchange="handleFileSelect(this, 'multi')">
                    <svg class="w-10 h-10 text-slate-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-sm text-slate-600 font-medium">اسحب الملفات هنا أو اضغط للاختيار</p>
                    <p class="text-xs text-slate-400 mt-1" id="multiFileCount"></p>
                </div>

                <button onclick="uploadMultiple()" id="btnMulti" disabled class="mt-4 w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl text-sm font-semibold transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
                    <span id="loaderMulti" class="loader hidden"></span>
                    <span id="textMulti">رفع الملفات</span>
                </button>
            </div>

            <!-- Upload Image -->
            <div class="glass rounded-2xl p-6 shadow-sm fade-in" style="animation-delay:0.3s">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800">رفع صورة</h2>
                </div>

                <div id="dropZoneImage" class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center transition-all cursor-pointer hover:border-emerald-400 hover:bg-emerald-50/50 bg-white/40 relative overflow-hidden">
                    <input type="file" id="fileImage" accept="image/*" class="hidden" onchange="handleImageSelect(this)">
                    <div id="imagePreviewContainer" class="hidden mb-3">
                        <img id="imagePreview" class="max-h-40 mx-auto rounded-lg shadow-md object-contain" />
                    </div>
                    <div id="imagePlaceholder">
                        <svg class="w-10 h-10 text-slate-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-sm text-slate-600 font-medium">اسحب الصورة هنا أو اضغط للاختيار</p>
                    </div>
                    <p class="text-xs text-slate-400 mt-1" id="imageFileName"></p>
                </div>

                <button onclick="uploadImage()" id="btnImage" disabled class="mt-4 w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl text-sm font-semibold transition-all shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                    <span id="loaderImage" class="loader hidden"></span>
                    <span id="textImage">رفع الصورة</span>
                </button>
            </div>

            <!-- Download / Stream -->
            <div class="glass rounded-2xl p-6 shadow-sm fade-in" style="animation-delay:0.4s">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-amber-100 text-amber-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800">تحميل / بث ملف</h2>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">معرف الملف (UUID)</label>
                        <input type="text" id="fileId" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all text-sm font-mono text-left"
                            placeholder="00000000-0000-0000-0000-000000000000">
                    </div>

                    <div class="flex gap-3">
                        <button onclick="downloadFile()" class="flex-1 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-sm font-semibold transition-all shadow-lg shadow-amber-600/20 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            تحميل
                        </button>
                        <button onclick="streamFile()" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-800 text-white rounded-xl text-sm font-semibold transition-all shadow-lg shadow-slate-700/20 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            بث / عرض
                        </button>
                    </div>
                </div>

                <!-- Stream Preview -->
                <div id="streamPreview" class="hidden mt-4 rounded-xl overflow-hidden bg-black/5 border border-slate-200">
                    <img id="streamImage" class="w-full max-h-64 object-contain hidden" />
                    <video id="streamVideo" class="w-full max-h-64 hidden" controls></video>
                    <audio id="streamAudio" class="w-full hidden" controls></audio>
                    <div id="streamGeneric" class="p-4 text-center text-sm text-slate-500 hidden">
                        <svg class="w-8 h-8 mx-auto mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <p>جاري عرض الملف...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Response Log -->
        <div class="glass rounded-2xl p-5 shadow-sm fade-in" style="animation-delay:0.5s">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    سجل الاستجابات
                </h3>
                <button onclick="clearLog()" class="text-xs text-slate-500 hover:text-red-500 transition-colors">مسح السجل</button>
            </div>
            <div id="responseLog" class="bg-slate-900 rounded-xl p-4 h-48 overflow-y-auto font-mono text-xs text-emerald-400 space-y-1">
                <div class="text-slate-500">// الاستجابات ستظهر هنا...</div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-20 left-4 z-50 space-y-3"></div>

    <script>
        // State
        let selectedSingleFile = null;
        let selectedMultiFiles = [];
        let selectedImageFile = null;

        function getBaseUrl() {
            return document.getElementById('baseUrl').value.replace(/\/$/, '');
        }

        // Drag & Drop Setup
        function setupDragDrop(zoneId, inputId, type) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);

            zone.addEventListener('click', () => input.click());

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-active');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-active');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-active');
                if (type === 'single') {
                    input.files = e.dataTransfer.files;
                    handleFileSelect(input, 'single');
                } else if (type === 'multi') {
                    input.files = e.dataTransfer.files;
                    handleFileSelect(input, 'multi');
                } else if (type === 'image') {
                    input.files = e.dataTransfer.files;
                    handleImageSelect(input);
                }
            });
        }

        setupDragDrop('dropZoneSingle', 'fileSingle', 'single');
        setupDragDrop('dropZoneMulti', 'fileMulti', 'multi');
        setupDragDrop('dropZoneImage', 'fileImage', 'image');

        // File Handlers
        function handleFileSelect(input, type) {
            if (type === 'single') {
                selectedSingleFile = input.files[0] || null;
                document.getElementById('singleFileName').textContent = selectedSingleFile ? selectedSingleFile.name : '';
                document.getElementById('btnSingle').disabled = !selectedSingleFile;
            } else if (type === 'multi') {
                selectedMultiFiles = Array.from(input.files);
                document.getElementById('multiFileCount').textContent = selectedMultiFiles.length > 0 ? `${selectedMultiFiles.length} ملف/ملفات محددة` : '';
                document.getElementById('btnMulti').disabled = selectedMultiFiles.length === 0;
            }
        }

        function handleImageSelect(input) {
            selectedImageFile = input.files[0] || null;
            document.getElementById('imageFileName').textContent = selectedImageFile ? selectedImageFile.name : '';
            document.getElementById('btnImage').disabled = !selectedImageFile;

            const preview = document.getElementById('imagePreview');
            const container = document.getElementById('imagePreviewContainer');
            const placeholder = document.getElementById('imagePlaceholder');

            if (selectedImageFile) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    container.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                };
                reader.readAsDataURL(selectedImageFile);
            } else {
                container.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        // Upload Functions
        async function uploadSingle() {
            if (!selectedSingleFile) return;
            setLoading('Single', true);

            const formData = new FormData();
            formData.append('File', selectedSingleFile);

            try {
                const response = await fetch(`${getBaseUrl()}/api/Files/upload`, {
                    method: 'POST',
                    body: formData
                });
                logResponse('POST /api/Files/upload', response.status, await response.text());
                showToast('success', 'تم رفع الملف بنجاح!');
            } catch (error) {
                logResponse('POST /api/Files/upload', 'ERROR', error.message);
                showToast('error', 'فشل رفع الملف: ' + error.message);
            } finally {
                setLoading('Single', false);
            }
        }

        async function uploadMultiple() {
            if (selectedMultiFiles.length === 0) return;
            setLoading('Multi', true);

            const formData = new FormData();
            selectedMultiFiles.forEach(file => formData.append('Files', file));

            try {
                const response = await fetch(`${getBaseUrl()}/api/Files/upload-many`, {
                    method: 'POST',
                    body: formData
                });
                logResponse('POST /api/Files/upload-many', response.status, await response.text());
                showToast('success', `تم رفع ${selectedMultiFiles.length} ملفات بنجاح!`);
            } catch (error) {
                logResponse('POST /api/Files/upload-many', 'ERROR', error.message);
                showToast('error', 'فشل رفع الملفات: ' + error.message);
            } finally {
                setLoading('Multi', false);
            }
        }

        async function uploadImage() {
            if (!selectedImageFile) return;
            setLoading('Image', true);

            const formData = new FormData();
            formData.append('Image', selectedImageFile);

            try {
                const response = await fetch(`${getBaseUrl()}/api/Files/upload-image`, {
                    method: 'POST',
                    body: formData
                });
                logResponse('POST /api/Files/upload-image', response.status, await response.text());
                showToast('success', 'تم رفع الصورة بنجاح!');
            } catch (error) {
                logResponse('POST /api/Files/upload-image', 'ERROR', error.message);
                showToast('error', 'فشل رفع الصورة: ' + error.message);
            } finally {
                setLoading('Image', false);
            }
        }

        // Download / Stream
        async function downloadFile() {
            const id = document.getElementById('fileId').value.trim();
            if (!id) { showToast('warning', 'أدخل معرف الملف أولاً'); return; }

            try {
                const response = await fetch(`${getBaseUrl()}/api/Files/download/${id}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `file-${id}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                logResponse('GET /api/Files/download/' + id, response.status, 'File downloaded');
                showToast('success', 'تم تحميل الملف!');
            } catch (error) {
                logResponse('GET /api/Files/download/' + id, 'ERROR', error.message);
                showToast('error', 'فشل التحميل: ' + error.message);
            }
        }

        async function streamFile() {
            const id = document.getElementById('fileId').value.trim();
            if (!id) { showToast('warning', 'أدخل معرف الملف أولاً'); return; }

            const url = `${getBaseUrl()}/api/Files/stream/${id}`;
            const preview = document.getElementById('streamPreview');
            const img = document.getElementById('streamImage');
            const vid = document.getElementById('streamVideo');
            const aud = document.getElementById('streamAudio');
            const gen = document.getElementById('streamGeneric');

            // Hide all
            [img, vid, aud, gen].forEach(el => el.classList.add('hidden'));
            preview.classList.remove('hidden');

            try {
                const response = await fetch(url, { method: 'GET' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const contentType = response.headers.get('content-type') || '';

                if (contentType.includes('image')) {
                    img.src = url;
                    img.classList.remove('hidden');
                } else if (contentType.includes('video')) {
                    vid.src = url;
                    vid.classList.remove('hidden');
                } else if (contentType.includes('audio')) {
                    aud.src = url;
                    aud.classList.remove('hidden');
                } else {
                    gen.classList.remove('hidden');
                    gen.innerHTML = `<p>جاري عرض: ${contentType || 'Unknown'}</p><a href="${url}" target="_blank" class="text-blue-600 underline mt-2 inline-block">فتح الملف</a>`;
                }

                logResponse('GET /api/Files/stream/' + id, response.status, `Content-Type: ${contentType}`);
                showToast('success', 'جاري بث الملف...');
            } catch (error) {
                logResponse('GET /api/Files/stream/' + id, 'ERROR', error.message);
                showToast('error', 'فشل البث: ' + error.message);
                preview.classList.add('hidden');
            }
        }

        // Test Connection
        async function testConnection() {
            try {
                const response = await fetch(`${getBaseUrl()}/api/Files/upload`, { method: 'OPTIONS' });
                showToast('success', 'الاتصال بالـ API ناجح!');
            } catch (error) {
                showToast('warning', 'تعذر الاتصال - تأكد من تشغيل الـ API وCORS');
            }
        }

        // Helpers
        function setLoading(type, loading) {
            document.getElementById(`loader${type}`).classList.toggle('hidden', !loading);
            document.getElementById(`btn${type}`).disabled = loading;
        }

        function logResponse(endpoint, status, body) {
            const log = document.getElementById('responseLog');
            const time = new Date().toLocaleTimeString('ar-EG');
            const color = status >= 200 && status < 300 ? 'text-emerald-400' : status === 'ERROR' ? 'text-red-400' : 'text-amber-400';
            const entry = document.createElement('div');
            entry.className = `border-b border-slate-800 pb-1 ${color}`;
            entry.innerHTML = `<span class="text-slate-500">[${time}]</span> <span class="font-bold">${endpoint}</span> - Status: ${status} <span class="text-slate-400">${body ? '| ' + body.substring(0, 100) : ''}</span>`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            document.getElementById('responseLog').innerHTML = '<div class="text-slate-500">// الاستجابات ستظهر هنا...</div>';
        }

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const colors = {
                success: 'bg-emerald-600',
                error: 'bg-red-600',
                warning: 'bg-amber-600'
            };

            const icons = {
                success: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>',
                error: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>',
                warning: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>'
            };

            toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 min-w-[280px]`;
            toast.innerHTML = `${icons[type]} <span class="text-sm font-medium">${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
